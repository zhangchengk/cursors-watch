<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cursor Agent 态势面板</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Cursor Agent 态势面板</h1>
      <div class="topbar-right">
        <div class="view-controls" role="group" aria-label="视图">
          <div class="seg" id="viewModeSeg">
            <button type="button" data-mode="attention" class="seg-btn" id="modeAttention">注意力</button>
            <button type="button" data-mode="workspace" class="seg-btn" id="modeWorkspace">按工程</button>
          </div>
          <div class="cols-control" id="colsControl" hidden>
            <button type="button" id="colsDec" aria-label="减少列数">−</button>
            <span id="colsValue">2</span>
            <button type="button" id="colsInc" aria-label="增加列数">+</button>
          </div>
        </div>
        <div id="counts" class="counts"></div>
        <label class="sound-toggle" title="通知声音（默认静音）">
          <input type="checkbox" id="soundToggle" />
          <span>声音</span>
        </label>
        <button type="button" id="fullscreenBtn" class="icon-btn" aria-pressed="false" title="全屏 (F)">
          全屏
        </button>
      </div>
    </header>
    <section id="inbox" aria-label="待确认 Reminder">
      <header class="inbox-header">
        <h2>待确认 Reminder</h2>
        <span id="inboxCount" class="inbox-count"></span>
      </header>
      <div id="inboxBody" class="inbox-body"></div>
    </section>
    <section id="sessionsSection" aria-label="运行中与最近">
      <header class="sessions-header">
        <h2>运行中 / 最近</h2>
      </header>
      <div id="list"></div>
    </section>
    <aside id="drawer" hidden></aside>
    <div id="toast" class="toast" hidden role="status"></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
