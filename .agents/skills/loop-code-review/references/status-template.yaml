report_path: "private/agents/review-loops/{branch}-{YYYYMMDD-HHmmss}-loop.md"
status_path: ".claude/skills/loop-code-review/status/{branch}-{YYYYMMDD-HHmmss}.yaml"

stuck_tracker: {}
