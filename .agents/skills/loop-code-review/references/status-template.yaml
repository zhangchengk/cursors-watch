# 位置：config.yaml → paths.status_dir

session_id: "{branch}-{YYYYMMDD-HHmmss}"
started_at: "2026-07-04T20:00:00+08:00"
updated_at: "2026-07-04T20:00:00+08:00"
status: running  # running | completed | aborted

base_sha: ""
head_sha: ""
branch: ""
description: ""
plan_path: null

max_rounds: 20
consecutive_clean_rounds: 3
round: 0
empty_round_count: 0
